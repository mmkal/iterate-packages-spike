<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stream viewer, no build</title>
<!-- The whole page an agent writes: one stylesheet, two imports, no build step, no import map.
     The stylesheet and both imports name @iterate-com/ui at `main`; esm.iterate.com sends each to
     the commit `main` is at. -->
<link rel="stylesheet" href="/@iterate-com/ui@github%3Ammkal%2Fiterate-packages-spike%23main%26path%3Apacked%2F%40iterate-com%2Fui/styles.css" />
<body class="m-0">
  <div id="root" class="flex h-screen flex-col"></div>
  <script type="module">
    import { html, render, useState } from "/@iterate-com/ui@github%3Ammkal%2Fiterate-packages-spike%23main%26path%3Apacked%2F%40iterate-com%2Fui/page";
    import { ContextView } from "/@iterate-com/ui@github%3Ammkal%2Fiterate-packages-spike%23main%26path%3Apacked%2F%40iterate-com%2Fui/components/context-view/context-view";

    // Sample events. A live page reads a real context instead (the `live` entry).
    const at = (s) => new Date(Date.UTC(2026, 9, 2, 13, 0, s)).toISOString();
    const me = { principal: { actor: "user:misha", email: "misha@iterate.com" } };
    const events = [
      { offset: 1, type: "events.iterate.com/itx/created", createdAt: at(0), payload: { path: "/agents/demo" }, source: { platform: true } },
      { offset: 2, type: "events.iterate.com/itx/subscription-configured", createdAt: at(1), payload: { name: "agent", target: "facet:agent" }, source: { platform: true } },
      { offset: 3, type: "chat/message-sent", createdAt: at(4), payload: { text: "What's on the calendar tomorrow?" }, source: me },
      { offset: 4, type: "chat/message-sent", createdAt: at(8), payload: { text: "One thing: a huddle with Jonas at 11." }, source: { processor: { slug: "agent", version: "1" } } },
    ];
    const context = {
      events,
      caughtUp: true,
      head: 4,
      processors: { rows: [{ name: "agent", target: "facet:agent", configuredAtOffset: 2, hostedFacet: { name: "agent", className: "Agent", restarts: 0 } }] },
      presence: { actors: [{ actor: "user:misha", email: "misha@iterate.com", lastSeenAt: at(9) }], rpcStubs: [] },
      liveState: {},
    };

    function App() {
      const [state, setState] = useState({});
      return html`<${ContextView}
        title="/agents/demo"
        context=${context}
        state=${state}
        onStateChange=${(patch) => setState((previous) => ({ ...previous, ...patch }))}
        className="min-h-0 flex-1"
      />`;
    }
    render(html`<${App} />`, document.getElementById("root"));
    // for the explainer that frames this page: when the first frame with the view in it painted
    requestAnimationFrame(() => setTimeout(() => parent.postMessage({ type: "rendered", at: performance.timeOrigin + performance.now() }, "*")));
  </script>
</body>
