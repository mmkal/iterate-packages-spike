<!doctype html>
<meta charset="utf-8" />
<title>Import map prefix test</title>
<!-- Can one entry map a whole package (`@iterate-com/ui/<anything>`) onto query-parameter URLs? -->
<script type="importmap">
  { "imports": { "@iterate-com/ui/": "http://localhost:8797/@iterate-com/ui?repository=mmkal/iterate-packages-spike&ref=main&path=./" } }
</script>
<pre id="out">…</pre>
<script type="module">
  try {
    await import("@iterate-com/ui/page");
    out.textContent = "loaded";
  } catch (error) {
    out.textContent = `${error}\nresolved to: ${import.meta.resolve("@iterate-com/ui/page")}`;
  }
</script>
